<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Doc-diff summary</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        :root { color-scheme: light dark; }
        body {
            font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            max-width: 1100px;
            margin: 2em auto;
            padding: 0 1em;
        }
        h1 { font-size: 1.5em; margin-bottom: 0.2em; }
        h1 + p { color: #666; margin-top: 0; }
        table { border-collapse: collapse; width: 100%; margin-top: 1em; }
        th, td { border-bottom: 1px solid #ddd; padding: 6px 10px; }
        th { text-align: left; background: #f5f5f5; position: sticky; top: 0; }
        td:nth-child(n+2), th:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
        tbody tr:hover { background: #fafafa; }
        a { color: #06f; text-decoration: none; }
        a:hover { text-decoration: underline; }
        code { font-size: 0.92em; }
        #loading { color: #999; }
    </style>
</head>
<body>
    <div id="content"><p id="loading">Loading summary…</p></div>

    <!-- marked is loaded from CDN; pin to a major version. If you want
         Subresource Integrity, copy the hash sdv jsdelivr publishes next to
         the file (https://www.jsdelivr.com/package/npm/marked → "SRI") into
         an integrity="…" attribute and add crossorigin="anonymous". -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
    <script>
        // Render summary.md (sibling file) into the page. Kept client-side
        // so the workflow doesn't need an extra build step.
        fetch('summary.md', { cache: 'no-store' })
            .then((r) => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            })
            .then((md) => {
                document.getElementById('content').innerHTML = marked.parse(md);
            })
            .catch((err) => {
                document.getElementById('content').innerHTML =
                    '<p style="color:#c00">Failed to load summary.md: ' + err.message + '</p>';
            });
    </script>
</body>
</html>
